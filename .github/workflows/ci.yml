name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit dependencies for high and critical vulnerabilities
        run: pnpm run audit:security

      - name: Lint files
        run: pnpm run lint:ci

      - name: Format check
        run: pnpm run format:check

      - name: Build dependencies first
        run: |
          pnpm --filter @react-native-youtube-bridge/core build
          pnpm --filter @react-native-youtube-bridge/react build
          pnpm --filter react-native-youtube-bridge build

      - name: Typecheck files
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm run test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: pnpm run build

      - name: Check packaged entry points and consumer types
        run: pnpm run test:packages

      # Release PRs consume changesets into versions/changelogs; merge queues
      # contain PRs whose changeset submission has already been checked.
      - name: Validate changeset submission
        if: >-
          ${{ github.event_name == 'pull_request' &&
              !(github.event.pull_request.head.repo.full_name == github.repository &&
                github.head_ref == 'changeset-release/main') }}
        run: pnpm changeset status --since=origin/main

      - name: Check Expo dependency compatibility
        working-directory: example
        run: pnpm exec expo install --check

      - name: Bundle example for iOS, Android, and Web
        working-directory: example
        run: pnpm exec expo export --platform all

      - name: Check native release bundling
        working-directory: example
        run: pnpm exec expo export:embed --platform android --dev false --entry-file index.js --bundle-output dist/native/index.android.bundle --assets-dest dist/native/assets

  external-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build shared dependencies
        run: |
          pnpm --filter @react-native-youtube-bridge/core build
          pnpm --filter @react-native-youtube-bridge/react build

      - name: Install pinned Bun
        run: |
          BUN_VERSION=$(node -p "require('./web/package.json').packageManager.split('@')[1]")
          npm install --global "bun@$BUN_VERSION"

      - name: Install external web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Audit external web dependencies
        working-directory: web
        run: bun audit --audit-level high

      - name: Typecheck and build external web
        working-directory: web
        run: |
          bun run typecheck
          bun run build
